name: ABI v2 offline checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DROCOS_SHM_BUILD_TESTS=ON
      - run: cmake --build build -- -j2
      - run: ctest --test-dir build -R '^rocos_shm_v2$' --output-on-failure --timeout 30
